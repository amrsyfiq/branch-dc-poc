# The branch service: stateless (its data is in the branch database), so any number of copies can run behind
# the one Service; WSO2's backend URL (http://branch-a:8080) never changes.
apiVersion: v1
kind: Service
metadata:
  name: branch
  labels: { app.kubernetes.io/name: branch-service, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  selector: { app.kubernetes.io/name: branch-service }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: branch
  labels: { app.kubernetes.io/name: branch-service, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  # No "replicas": the HorizontalPodAutoscaler (hpa.yaml) owns the number of copies. With a number here, every
  # kubectl apply (a redeploy) would reset it to that number in the middle of a rush.
  selector:
    matchLabels: { app.kubernetes.io/name: branch-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: branch-service, app.kubernetes.io/part-of: branch-dc-poc }
    spec:
      enableServiceLinks: false
      containers:
        - name: branch
          image: branch-dc/branch-service:latest   # replaced by a unique tag by k8s/deploy.mjs
          env:
            - { name: BRANCH_ID, value: X }       # set by the overlay
            - { name: DB_URL, value: "jdbc:postgresql://postgres-x:5432/branch" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db, key: password } }
            # Trust only this branch's WSO2 signing key: a JWT from the other branch's WSO2 is rejected.
            - { name: BRANCH_GATEWAY_CERT, value: "file:/certs/gateway.pem" }
            - { name: LOGGING_STRUCTURED_FORMAT_CONSOLE, value: ecs }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 200m, memory: 448Mi }
            limits: { memory: 448Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          # Generous on purpose: liveness restarts the pod, and a pod that is only slow (a busy node) must not be
          # restarted, which would add load. Measured: with the 1 s default, busy moments restarted healthy pods.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # Quick: readiness only takes the pod out of the Service while it does not answer.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - { name: gateway-cert, mountPath: /certs, readOnly: true }
      volumes:
        - name: gateway-cert
          secret:
            secretName: gateway-cert
            items: [{ key: signing-cert.pem, path: gateway.pem }]
