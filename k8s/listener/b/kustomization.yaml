# Listener B: lives in namespace dc, reads dc.branch-b, delivers through WSO2-B (ports 9445 / 8245).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dc
nameSuffix: -b
# Labels on the objects and their pods only (includeSelectors would also rewrite the NetworkPolicies'
# destination selectors, e.g. "Kafka pods with branch=a", which match nothing).
labels:
  - pairs: { branch: b }
    includeTemplates: true
resources:
  - ../base
  - network-policy.yaml
patches:
  - target: { kind: Deployment, name: listener }
    patch: |-
      - { op: add, path: /spec/selector/matchLabels/branch, value: b }
      - { op: replace, path: /spec/template/spec/containers/0/env/0/value, value: B }
      - { op: replace, path: /spec/template/spec/containers/0/env/1/value, value: "https://wso2-b:8245/branch-b/1.0.0" }
      - { op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "https://wso2-b:9445/oauth2/token" }
      - { op: replace, path: /spec/template/spec/containers/0/envFrom/0/secretRef/name, value: listener-b-client }
      - { op: replace, path: /spec/template/spec/volumes/0/secret/secretName, value: gateway-cert-b }
  - target: { kind: ScaledObject, name: listener }
    patch: |-
      - { op: replace, path: /spec/scaleTargetRef/name, value: listener-b }
      - { op: replace, path: /spec/triggers/0/metadata/consumerGroup, value: listener-b }
      - { op: replace, path: /spec/triggers/0/metadata/topic, value: dc.branch-b }
  - target: { kind: Service, name: wso2 }
    patch: |-
      - { op: replace, path: /spec/externalName, value: wso2-b.branch-b.svc.cluster.local }
