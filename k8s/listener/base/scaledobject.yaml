# Scales the listener on its Kafka lag (events in its topic that its group has not processed yet) with KEDA
# (k8s/addons/keda). KEDA runs an ordinary HPA for us (keda-hpa-listener-x), which asks KEDA for the lag every 15 s:
#   wanted copies = lag / lagThreshold, rounded up; at least 1, at most maxReplicaCount.
# CPU is the wrong signal for a listener: it mostly waits for WSO2's answer, so its CPU stays low however long the
# queue gets.
#
#   kubectl get scaledobject -n dc        READY / ACTIVE (active = lag above 0)
#   kubectl get hpa -n dc -w              the copies, as KEDA's HPA decides them
#
# The overlays set the target, topic and group (Kustomize does not rename names inside custom resources).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: listener
  labels: { app.kubernetes.io/name: branch-listener, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  scaleTargetRef: { name: listener-x }
  minReplicaCount: 1
  # 6 partitions allow up to 6 useful copies; 3 here because of this PC's memory (3 x 384Mi next to the rest).
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Down only after 2 minutes with less lag (the default is 5), then 1 copy a minute: as for the branch.
        scaleDown:
          stabilizationWindowSeconds: 120
          policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-bootstrap.platform.svc.cluster.local:9092
        consumerGroup: listener-x
        topic: dc.branch-x
        # One copy per 500 waiting events. A rush of 10,000 asks for the maximum; a sync of a few hundred for 1-2.
        lagThreshold: "500"
        # Only counts that divide the 6 partitions evenly (1, 2, 3, 6): every copy gets the same share.
        ensureEvenDistributionOfPartitions: "true"
