# Kafka, single node in KRaft mode (broker + controller in one process). In real life the Kafka team runs a
# cluster; this POC only uses its topics (created by the DC service).
# A StatefulSet: the pod has a stable name (kafka-0) and its own disk, which survives restarts.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  clusterIP: None   # headless: kafka-0.kafka.platform.svc resolves to the pod itself
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: kafka, port: 9092 }
---
# How clients connect (bootstrap). Not headless: this name always resolves, even while Kafka is starting, so the
# clients keep retrying instead of failing at startup (a headless name has no address until the pod is ready).
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: branch-dc-poc }
    spec:
      # Kubernetes would otherwise inject KAFKA_PORT=tcp://... for the "kafka" Service, and the image turns
      # every KAFKA_* variable into a broker setting.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:4.2.2
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.platform.svc.cluster.local:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            # Topics are created by the DC service (NewTopic beans), not by a typo in a producer.
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
          ports:
            - { name: kafka, containerPort: 9092 }
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 768Mi }
          startupProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
