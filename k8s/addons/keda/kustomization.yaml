# KEDA (Kubernetes Event-Driven Autoscaling): lets the autoscaler scale on work that is waiting instead of CPU,
# here each listener's Kafka lag (k8s/listener/base/scaledobject.yaml). KEDA 2.21 is tested with Kubernetes
# 1.34-1.36. Three pods in namespace keda (operator, metrics API server, admission webhooks), 100Mi requested each.
# Installed by k8s/deploy.mjs; by hand (server-side: its CRDs are too big for client-side apply):
#   kubectl apply --server-side -k k8s/addons/keda
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kedacore/keda/releases/download/v2.21.0/keda-2.21.0.yaml
