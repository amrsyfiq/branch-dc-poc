# The DC service. Reached from your PC only through  kubectl port-forward  (k8s/port-forward.mjs, port 8090).
apiVersion: v1
kind: Service
metadata:
  name: dc-service
  labels: { app.kubernetes.io/name: dc-service, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  selector: { app.kubernetes.io/name: dc-service }
  ports:
    - { name: http, port: 8090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dc-service
  labels: { app.kubernetes.io/name: dc-service, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: dc-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: dc-service, app.kubernetes.io/part-of: branch-dc-poc }
    spec:
      enableServiceLinks: false
      containers:
        - name: dc-service
          image: branch-dc/dc-service:latest   # replaced by a unique tag by k8s/deploy.mjs
          env:
            - { name: DB_URL, value: "jdbc:postgresql://postgres-dc:5432/dc" }
            - name: DC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db, key: password } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka-bootstrap.platform.svc.cluster.local:9092" }
            - { name: LOGGING_STRUCTURED_FORMAT_CONSOLE, value: ecs }
            # Measured with Native Memory Tracking after a sync of 93,144 passes: besides its heap the JVM holds
            # ~205 MiB (metaspace, class data and symbols 160, compiled code 33), and the JIT compiler briefly took
            # another 48 MiB that the C library kept. With the image's 55% (Dockerfile) the heap alone could reach
            # ~246 MiB: the DC hit its 448Mi limit and was OOMKilled. 30% = ~136 MiB of heap (the chunked sync needs
            # far less), and every 30 s the JVM hands freed native memory back. JDK_JAVA_OPTIONS comes after
            # JAVA_TOOL_OPTIONS, so these values win.
            - { name: JDK_JAVA_OPTIONS, value: "-XX:MaxRAMPercentage=30 -XX:TrimNativeHeapInterval=30000" }
            # glibc keeps a memory pool per thread by default (up to 8 per core); two waste far less memory.
            - { name: MALLOC_ARENA_MAX, value: "2" }
          ports:
            - { name: http, containerPort: 8090 }
          resources:
            requests: { cpu: 200m, memory: 448Mi }
            limits: { memory: 448Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          # Generous on purpose: liveness restarts the pod, and a pod that is only slow (a busy node) must not be
          # restarted, which would add load. Measured: with the 1 s default, busy moments restarted healthy pods.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # Quick: readiness only takes the pod out of the Service while it does not answer.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
