apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  labels: { app.kubernetes.io/name: kafka-ui, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  selector: { app.kubernetes.io/name: kafka-ui }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels: { app.kubernetes.io/name: kafka-ui, app.kubernetes.io/part-of: branch-dc-poc }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka-ui }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka-ui, app.kubernetes.io/part-of: branch-dc-poc }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          env:
            - { name: KAFKA_CLUSTERS_0_NAME, value: dc }
            - { name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka-bootstrap.platform.svc.cluster.local:9092" }
            - { name: JAVA_OPTS, value: "-Xms64m -Xmx256m" }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
---
# Kafka UI may reach Kafka, nothing else (Kafka already admits pods named kafka-ui from namespace dc).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: kafka-ui }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: kafka-ui }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: platform }
          podSelector:
            matchLabels: { app.kubernetes.io/name: kafka }
      ports:
        - { port: 9092 }
