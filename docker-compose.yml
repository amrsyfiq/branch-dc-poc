# Branch–DC event-driven POC.
#   docker compose up -d        -> Oracle + Kafka (+ the apps, added in later phases)
#   docker compose --profile ui up -d   -> also Kafka UI on http://localhost:8096
# Values come from .env (create it with: node infra/init-env.mjs).
#
# "Environments" are Docker networks. A container can only reach containers on a network it has joined:
#   dc-net        DC service, Kafka, listeners
#   branch-a-net  listener A, WSO2 A, branch A
#   branch-b-net  listener B, WSO2 B, branch B
# Branch containers never join dc-net, so they cannot call the DC or Kafka.

name: branch-dc

services:
  oracle:
    # One Oracle server, one pluggable database (PDB) per site, created on first start by
    # infra/oracle/01-create-pdbs.sh. POC simplification: the server is shared, the databases are not.
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: bdc-oracle
    ports:
      - "127.0.0.1:1531:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      DC_DB_PASSWORD: ${DC_DB_PASSWORD:?set DC_DB_PASSWORD in .env}
      BRANCH_A_DB_PASSWORD: ${BRANCH_A_DB_PASSWORD:?set BRANCH_A_DB_PASSWORD in .env}
      BRANCH_B_DB_PASSWORD: ${BRANCH_B_DB_PASSWORD:?set BRANCH_B_DB_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle:/container-entrypoint-initdb.d:ro
    # Joins every network so each site can reach its own PDB. Docker does not route between
    # networks through a container, so this does not connect branch-a-net to dc-net.
    networks: [dc-net, branch-a-net, branch-b-net]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kafka:
    # Single node in KRaft mode (broker + controller in one process, no ZooKeeper).
    # POC simplification: one Kafka for all sites (real setups: a cluster per site + MirrorMaker 2).
    image: apache/kafka:4.2.2
    container_name: bdc-kafka
    ports:
      - "127.0.0.1:9094:9094"   # for apps and tools on your machine (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST for your machine, INTERNAL for containers on dc-net, CONTROLLER for KRaft itself.
      KAFKA_LISTENERS: HOST://:9094,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9094,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the DC service (NewTopic beans), not by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    networks: [dc-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  dc-service:
    build:
      context: .
      args:
        MODULE: dc-service
    image: branch-dc/dc-service
    container_name: bdc-dc-service
    ports:
      - "127.0.0.1:8090:8090"   # GET /data, POST /sync/{branch}, POST /purge/{branch}, GET /sync-log
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/DC_PDB
      DC_DB_PASSWORD: ${DC_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks: [dc-net]
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl; bash (not sh) can open a TCP connection by itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8090 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # ---- Branch environments: same image, different BRANCH_ID and database. ----
  # Not published on your machine: the only way in is from inside the branch's own network
  # (the listener now, the branch's WSO2 gateway from Phase 3).

  branch-a:
    build: &branch-build
      context: .
      args:
        MODULE: branch-service
    image: branch-dc/branch-service
    container_name: bdc-branch-a
    environment:
      BRANCH_ID: A
      DB_URL: jdbc:oracle:thin:@//oracle:1521/BRANCH_A_PDB
      DB_PASSWORD: ${BRANCH_A_DB_PASSWORD}
      # Trust only WSO2-A's signing key: a JWT from WSO2-B is rejected.
      BRANCH_GATEWAY_CERT: file:/certs/gateway.pem
    volumes:
      - ./infra/wso2/generated/a/signing-cert.pem:/certs/gateway.pem:ro
    networks: [branch-a-net]
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck: &spring-health
      # The JRE image has no curl; bash (not sh) can open a TCP connection by itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  branch-b:
    build: *branch-build
    image: branch-dc/branch-service
    container_name: bdc-branch-b
    environment:
      BRANCH_ID: B
      DB_URL: jdbc:oracle:thin:@//oracle:1521/BRANCH_B_PDB
      DB_PASSWORD: ${BRANCH_B_DB_PASSWORD}
      BRANCH_GATEWAY_CERT: file:/certs/gateway.pem
    volumes:
      - ./infra/wso2/generated/b/signing-cert.pem:/certs/gateway.pem:ro
    networks: [branch-b-net]
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck: *spring-health

  # ---- WSO2 API Manager, one per branch environment: the only way into the branch. ----
  # Only on its branch's internal network, like the branch itself: it has no route out either.
  # Your machine (portals, dashboard) reaches it through the branch's edge forwarder below.
  # ~1.4 GB each; first start takes ~2 minutes. Run  node infra/wso2/init-keys.mjs  before the first start.

  # One-shot: the WSO2 search-index folder does not exist in the image, so Docker creates its volume owned
  # by root; WSO2 runs as uid 10001 and could not write to it. Runs before the WSO2 containers, then exits.
  wso2-volumes:
    image: alpine/socat:1.8.1.1
    container_name: bdc-wso2-volumes
    user: root
    entrypoint: ["sh", "-c", "chown 10001:10001 /a /b"]
    volumes:
      - wso2-a-index:/a
      - wso2-b-index:/b
    network_mode: none

  wso2-a:
    image: wso2/wso2am:4.7.0
    container_name: bdc-wso2-a
    environment: &wso2-env
      WSO2_PORT_OFFSET: 1
      WSO2_ADMIN_PASSWORD: ${WSO2_ADMIN_PASSWORD:?set WSO2_ADMIN_PASSWORD in .env}
      WSO2_ENCRYPTION_KEY: ${WSO2_ENCRYPTION_KEY:?set WSO2_ENCRYPTION_KEY in .env}
      JVM_MEM_OPTS: "-Xms256m -Xmx1024m"
    volumes:
      - ./infra/wso2/deployment.toml:/home/wso2carbon/wso2am-4.7.0/repository/conf/deployment.toml:ro
      # This instance's own signing key (infra/wso2/init-keys.mjs)
      - ./infra/wso2/generated/a/wso2carbon.jks:/home/wso2carbon/wso2am-4.7.0/repository/resources/security/wso2carbon.jks:ro
      - ./infra/wso2/generated/a/client-truststore.jks:/home/wso2carbon/wso2am-4.7.0/repository/resources/security/client-truststore.jks:ro
      # WSO2 state, kept when the container is recreated: APIs, applications and users (H2 files), and the
      # search index that the Publisher / Developer Portal list APIs from (without it they "disappear").
      - wso2-a-db:/home/wso2carbon/wso2am-4.7.0/repository/database
      - wso2-a-index:/home/wso2carbon/wso2am-4.7.0/solr
    networks: [branch-a-net]
    depends_on:
      wso2-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:9444/services/Version > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  wso2-b:
    image: wso2/wso2am:4.7.0
    container_name: bdc-wso2-b
    environment:
      <<: *wso2-env
      WSO2_PORT_OFFSET: 2
    volumes:
      - ./infra/wso2/deployment.toml:/home/wso2carbon/wso2am-4.7.0/repository/conf/deployment.toml:ro
      - ./infra/wso2/generated/b/wso2carbon.jks:/home/wso2carbon/wso2am-4.7.0/repository/resources/security/wso2carbon.jks:ro
      - ./infra/wso2/generated/b/client-truststore.jks:/home/wso2carbon/wso2am-4.7.0/repository/resources/security/client-truststore.jks:ro
      # WSO2 state, kept when the container is recreated: APIs, applications and users (H2 files), and the
      # search index that the Publisher / Developer Portal list APIs from (without it they "disappear").
      - wso2-b-db:/home/wso2carbon/wso2am-4.7.0/repository/database
      - wso2-b-index:/home/wso2carbon/wso2am-4.7.0/solr
    networks: [branch-b-net]
    depends_on:
      wso2-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:9445/services/Version > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ---- Edge forwarders: each branch's single public entrance (think firewall / load balancer). ----
  # A plain TCP forwarder (TLS passes through untouched): your machine -> edge-x -> wso2-x.
  # It only forwards incoming connections to its WSO2; nothing inside the branch can use it to get out.
  # Needed because a container on a normal (non-internal) network can reach everything published on
  # your machine via host.docker.internal; so WSO2 stays internal and only this tiny forwarder is not.

  edge-a:
    image: alpine/socat:1.8.1.1
    container_name: bdc-edge-a
    entrypoint: ["sh", "-c"]
    command:
      - socat TCP-LISTEN:9444,fork,reuseaddr TCP:wso2-a:9444 & exec socat TCP-LISTEN:8244,fork,reuseaddr TCP:wso2-a:8244
    ports:
      - "127.0.0.1:9444:9444"   # WSO2-A Publisher / Developer Portal / token endpoint: https://localhost:9444
      - "127.0.0.1:8244:8244"   # WSO2-A gateway: https://localhost:8244/branch-a/1.0.0/...
    networks: [branch-a-net, branch-a-edge]

  edge-b:
    image: alpine/socat:1.8.1.1
    container_name: bdc-edge-b
    entrypoint: ["sh", "-c"]
    command:
      - socat TCP-LISTEN:9445,fork,reuseaddr TCP:wso2-b:9445 & exec socat TCP-LISTEN:8245,fork,reuseaddr TCP:wso2-b:8245
    ports:
      - "127.0.0.1:9445:9445"   # WSO2-B portals / token endpoint
      - "127.0.0.1:8245:8245"   # WSO2-B gateway: https://localhost:8245/branch-b/1.0.0/...
    networks: [branch-b-net, branch-b-edge]

  # ---- Listeners: live in the DC environment, one per branch. Each joins dc-net (to read Kafka)
  # and its own branch's network (to deliver), never the other branch's network. ----

  listener-a:
    build: &listener-build
      context: .
      args:
        MODULE: branch-listener
    image: branch-dc/branch-listener
    container_name: bdc-listener-a
    environment:
      BRANCH_ID: A
      # Through branch A's WSO2 gateway, with a client-credentials token from that same WSO2.
      BRANCH_URL: https://wso2-a:8244/branch-a/1.0.0
      TOKEN_URL: https://wso2-a:9444/oauth2/token
      GATEWAY_CERT: file:/certs/gateway.pem
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    # CLIENT_ID, CLIENT_SECRET, SCOPE: written by  node infra/wso2/setup.mjs
    env_file:
      - path: ./infra/wso2/generated/a/listener.env
        required: false
    volumes:
      - ./infra/wso2/generated/a/signing-cert.pem:/certs/gateway.pem:ro
    networks: [dc-net, branch-a-net]
    depends_on:
      kafka:
        condition: service_healthy
      wso2-a:
        condition: service_healthy
      # The DC service creates the topics.
      dc-service:
        condition: service_healthy
    healthcheck: *spring-health

  listener-b:
    build: *listener-build
    image: branch-dc/branch-listener
    container_name: bdc-listener-b
    environment:
      BRANCH_ID: B
      # Through branch B's WSO2 gateway, with a client-credentials token from that same WSO2.
      BRANCH_URL: https://wso2-b:8245/branch-b/1.0.0
      TOKEN_URL: https://wso2-b:9445/oauth2/token
      GATEWAY_CERT: file:/certs/gateway.pem
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    # CLIENT_ID, CLIENT_SECRET, SCOPE: written by  node infra/wso2/setup.mjs
    env_file:
      - path: ./infra/wso2/generated/b/listener.env
        required: false
    volumes:
      - ./infra/wso2/generated/b/signing-cert.pem:/certs/gateway.pem:ro
    networks: [dc-net, branch-b-net]
    depends_on:
      kafka:
        condition: service_healthy
      wso2-b:
        condition: service_healthy
      dc-service:
        condition: service_healthy
    healthcheck: *spring-health

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: bdc-kafka-ui
    profiles: ["ui"]
    ports:
      - "127.0.0.1:8096:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [dc-net]
    depends_on:
      kafka:
        condition: service_healthy

networks:
  dc-net:
  # internal: no route out of the network at all, not even to your machine. Without it, a branch could
  # still call the DC through the DC's port published on the host (host.docker.internal:8090).
  branch-a-net:
    internal: true
  branch-b-net:
    internal: true
  # Only the edge forwarders join these: they let a branch's WSO2 be published on your machine.
  branch-a-edge:
  branch-b-edge:

volumes:
  oracle-data:
  wso2-a-db:
  wso2-a-index:
  wso2-b-db:
  wso2-b-index:
