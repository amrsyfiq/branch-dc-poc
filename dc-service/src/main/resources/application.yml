server:
  port: ${SERVER_PORT:8090}

dc:
  topics:
    # Partitions per branch topic = the most listener consumers that can deliver to one branch at once.
    partitions: ${DC_TOPIC_PARTITIONS:6}
  publish:
    # Events loaded, sent and confirmed per step (PassEventPublisher): memory stays the same however big a
    # checkpoint grows. All at once, a sync of 43,144 passes ran the DC out of memory.
    chunk-size: 1000
  time-zone: Asia/Kuala_Lumpur

spring:
  application:
    name: dc-service
  config:
    # Local secrets live in the git-ignored .env at the repo root. Both paths are listed so it works
    # from the repo root and from dc-service/. In Docker the values come from environment variables.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    # The DC's own PostgreSQL database.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dc}
    username: ${DB_USERNAME:dc}
    password: ${DC_DB_PASSWORD:}
    hikari:
      pool-name: DcPool
      maximum-pool-size: 5

  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # No lazy loading during JSON rendering: services return DTOs, entities stay inside transactions.
    open-in-view: false
    properties:
      # The rush inserts thousands of passes: send them to the database 500 at a time, not one by one.
      hibernate.jdbc.batch_size: 500
      hibernate.order_inserts: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Success only once the broker has stored the record.
      acks: all
      properties:
        # Receivers know the payload type; no Java class names in record headers.
        spring.json.add.type.headers: false
        # Kafka unreachable (no metadata within 5 s): fail fast, so a sync request does not hang.
        max.block.ms: 5000
        # Kafka reachable but slow (measured: a 2000-pass rush on this 4-core PC, with the listener, WSO2 and the
        # branch busy at the same time, had batches still unconfirmed after 10 s): wait up to a minute.
        # Retries are safe: the producer is idempotent, so the broker drops duplicates.
        request.timeout.ms: 15000
        delivery.timeout.ms: 60000
        # Wait up to 5 ms to fill a batch: a sync or rush sends many small records at once.
        linger.ms: 5
    template:
      # A span per record, and its trace id in the record's traceparent header: the listener and the branch
      # log the same trace id as the request that created the event.
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      # Trace every request. Nothing is exported (no tracing server), so this only costs a few ids.
      probability: 1.0

logging:
  level:
    com.branchdc: INFO
  # JSON (Elastic Common Schema) only when LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs is set (Docker, Kubernetes);
  # readable text when you run it on your machine.
  structured:
    ecs:
      service:
        # The pod name in Kubernetes (HOSTNAME), the container id in Docker: which copy wrote the line.
        node-name: ${HOSTNAME:local}
    json:
      add:
        site: DC
