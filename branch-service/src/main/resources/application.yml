server:
  port: ${SERVER_PORT:8080}

# Which branch this deployment is. Same jar, different BRANCH_ID and database per branch.
branch:
  id: ${BRANCH_ID:A}
  security:
    # wso2: every request needs a valid X-JWT-Assertion signed by THIS branch's WSO2 (see GatewaySecurityConfig).
    # none: no check (tests, local runs without WSO2). Never in compose.
    mode: ${BRANCH_SECURITY_MODE:wso2}
    # This branch's WSO2 signing certificate (infra/wso2/init-keys.mjs)
    certificate: ${BRANCH_GATEWAY_CERT:file:infra/wso2/generated/a/signing-cert.pem}
    # "iss" claim of the gateway JWT
    issuer: ${BRANCH_GATEWAY_ISSUER:wso2.org/products/am}

spring:
  application:
    name: branch-service
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    # This branch's own database, e.g. BRANCH_A_PDB. Run locally for branch B with
    # BRANCH_ID=B DB_URL=jdbc:oracle:thin:@//localhost:1531/BRANCH_B_PDB DB_PASSWORD=...
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1531/BRANCH_A_PDB}
    username: ${DB_USERNAME:branch}
    password: ${DB_PASSWORD:${BRANCH_A_DB_PASSWORD:}}
    hikari:
      pool-name: BranchPool
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.branchdc: DEBUG
